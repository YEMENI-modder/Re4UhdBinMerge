name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (net48, Release)
        run: dotnet build src/RE4_UHD_BIN_MERGE.csproj -c Release -o artifacts/build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/package | Out-Null
          Copy-Item artifacts/build/RE4_UHD_BIN_MERGE.exe artifacts/package/
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.md, README.md, README_AR.md artifacts/package/
          Copy-Item Examples artifacts/package/Examples -Recurse
          Compress-Archive -Path artifacts/package/* -DestinationPath RE4_UHD_BIN_MERGE.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RE4_UHD_BIN_MERGE
          path: RE4_UHD_BIN_MERGE.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RE4_UHD_BIN_MERGE.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
